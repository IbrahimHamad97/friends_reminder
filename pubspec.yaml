name: friends_reminder
description: "Private reminder app for friend birthdays and check-in rhythms."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  go_router: ^14.6.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.3
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  share_plus: ^10.1.4
  flutter_colorpicker: ^1.1.0
  flutter_image_compress: ^2.4.0
  image: ^4.8.0
  crop_your_image: ^2.0.0
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_mascot.png
    - assets/config/cloudinary.env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_mascot.png
  adaptive_icon_background: "#FFF8F5"
  adaptive_icon_foreground: assets/branding/app_mascot.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#12161F"
  image: assets/branding/app_mascot.png
  android_12:
    color: "#12161F"
    image: assets/branding/app_mascot.png
    icon_background_color: "#1A2233"
  ios: true
  android: true
  web: true
